 @page{size:A5;margin:0}*{box-sizing:border-box;margin:0}body{font:12px/1.6 Manrope,sans-serif;color:#2a1e17;background:#e9e4dc}
 .pg{width:148mm;min-height:210mm;padding:14mm 13mm 10mm;margin:12px auto;background:#fff;position:relative;display:flex;flex-direction:column;break-after:page}
 .pg:last-child{break-after:auto}
 header{display:flex;gap:12px;align-items:center;border-bottom:1.5px solid #b98b4e;padding-bottom:10px}
 header b{font:600 19px 'Cormorant Garamond',serif;display:block}header span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f76}
 h1{font:600 20px 'Cormorant Garamond',serif;margin:18px 0 12px;text-align:center}
 .pac{margin-bottom:14px}.txt{white-space:pre-wrap;flex:1;font-size:12.5px}
 .ass{text-align:center;margin-top:30px;font-size:11px}.ass .ln{width:60%;margin:0 auto 6px;border-top:1px solid #2a1e17}
 .dt{text-align:center;font-size:11px;color:#8a7f76;margin-top:8px}
 .via{position:absolute;top:5mm;right:13mm;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#b98b4e}
 .box{border:1px solid #ccc;border-radius:4px;padding:6px 8px;font-size:9.5px;line-height:1.7;margin-bottom:8px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid .box{margin:0}
 footer{border-top:1px solid #e9d8a6;margin-top:14px;padding-top:6px;text-align:center;font-size:8.5px;color:#8a7f76}
 @media print{body{background:#fff}.pg{margin:0}}
 </style></head><body>${Array.from({length:vias},(_,i)=>page(i+1)).join('')}<script>document.fonts.ready.then(()=>setTimeout(print,300))<\/script></body></html>`);
 w.document.close();return true}
document.addEventListener('click',e=>{
 const tg=e.target.closest('#odoMain .tooth');
 if(tg){const n=+tg.dataset.t;
  if(omode==='ini'||tool==='ver'||e.target.classList.contains('tn')){selT=n;return render()}
  const pr=PRt(),d=pr.odo[n]||(pr.odo[n]={f:{},t:{}}),ty=TOOLS.find(x=>x[0]===tool)[2];
  if(tool==='del')delete pr.odo[n];
  else if(ty==='f'){const f=e.target.dataset.f;if(!f)return;const c=d.f[f];if(c&&c.c===tool&&c.s===stat)delete d.f[f];else d.f[f]={c:tool,s:stat};delete d.t.aus}
  else if(d.t[tool])delete d.t[tool];
  else if(tool==='aus')pr.odo[n]={f:{},t:{aus:'r'}};
  else{d.t[tool]=stat;delete d.t.aus}
  selT=n;log(pr,`Editou odontograma (dente ${n})`);return render()}
 const t=e.target.closest('[data-p]');if(!t)return;
 const a=t.dataset.p,v=t.dataset.v,pr=PRt(),p=P[pid];
 if(a==='tab'){ptab=v;selT=null}
 else if(a==='tool')tool=v;else if(a==='st')stat=v;else if(a==='dent')dent=v;else if(a==='omode')omode=v;else if(a==='endoT')endoT=v;
 else if(a==='goendo'){ptab='endo';endoT=v}
 else if(a==='goevo'){ptab='evo';evoPre=v}
 else if(a==='addcan')pr.endo[endoT].can.push({c:'',ref:'',cad:'',crd:'',crt:'',li:'',lm:''});
 else if(a==='cstart'){pr.clar={ini:'A3',alvo:'A1',tec:'Consultório',ag:'Peróxido de hidrogênio',conc:'35%',barr:'Sim',sess:[]};log(pr,'Abriu ficha de clareamento')}
 else if(a==='csadd'){const c=pr.clar;c.sess.push({d:hoje(),cor:c.sess.length?c.sess.at(-1).cor:c.ini,sens:'0',obs:''})}
 else if(a==='paprov'){pr.aprov=hoje();log(pr,'Registrou aprovação do plano');toast('Plano aprovado')}
 else if(a==='penv'){const it=planItems(pr);say(pid,'me',`Olá, ${p.n.split(' ')[0]}! Segue seu plano de tratamento: ${it.map(i=>`${i.desc} no dente ${i.n}`).join('; ')}. Total: ${brl(it.reduce((s,i)=>s+price(i),0))}. Qualquer dúvida, estou à disposição.`);toast('Orçamento enviado pelo WhatsApp')}
 else if(a==='pconc'){const [n,k]=v.split('-'),d=pr.odo[n],it=planItems(pr).find(x=>x.k===v);
  if(k==='rest')for(const f in d.f){if(d.f[f].c!=='sel')d.f[f]={c:'rest',s:'r'}}
  if(k==='sel')for(const f in d.f){if(d.f[f].c==='sel')d.f[f].s='r'}
  if(TXT[k])d.t[k]='r';
  if(k==='ext')pr.odo[n]={f:{},t:{aus:'r'}};
  pr.evo.unshift({dt:hoje(),dente:n,proc:`${it.desc} · dente ${n}`,txt:'Procedimento concluído conforme plano de tratamento.'});log(pr,'Concluiu '+it.desc+' no dente '+n);toast('Concluído e registrado na evolução')}
 else if(a==='tsend'){const d=pr.docs[v];d.s='env';say(pid,'bot',`Olá, ${p.n.split(' ')[0]}! Segue o documento "${d.n}" para leitura e assinatura digital: [link]`);toast('Enviado para assinatura pelo WhatsApp');
  setTimeout(()=>{d.s='ok';d.dt=hoje();log(pr,'Paciente assinou '+d.n);toast(p.n.split(' ')[0]+' assinou o documento ✔');if(view==='pront')render()},2500)}
 else if(a==='emit')return emitDlg(v,p,pr);
 else if(a==='cfo'){window.open('https://prescricao.cfo.org.br/login','_blank','noopener');log(pr,'Abriu a Prescrição Eletrônica do CFO');return toast('Abrindo a Prescrição Eletrônica do CFO')}
 else return;
 render()});
document.addEventListener('input',e=>{const el=e.target;if(view!=='pront'||!PR[pid])return;const pr=PR[pid],val=el.type==='checkbox'?el.checked:el.value;
 if(el.dataset.an!==undefined)pr.an[el.dataset.an]=val;
 else if(el.dataset.e)pr.endo[endoT][el.dataset.e]=val;
 else if(el.dataset.c){const [i,k]=el.dataset.c.split('.');pr.endo[endoT].can[i][k]=val}
 else if(el.dataset.cl)pr.clar[el.dataset.cl]=val;
 else if(el.dataset.cs){const [i,k]=el.dataset.cs.split('.');pr.clar.sess[i][k]=val;if(el.type==='range')el.nextElementSibling.textContent=val+'/10'}
 else return;
 clearTimeout(saveT);saveT=setTimeout(()=>{log(pr,'Editou '+PT.find(x=>x[0]===ptab)[1].toLowerCase());toast('Salvo automaticamente')},900);
 if(el.tagName==='SELECT'||el.type==='checkbox')render()});
document.addEventListener('change',e=>{if(e.target.id!=='upl')return;const pr=PRt();[...e.target.files].forEach(f=>pr.anexos.push({src:URL.createObjectURL(f),n:f.name,dt:hoje()}));log(pr,'Anexou arquivo');toast('Anexado ao prontuário');render()});
document.addEventListener('submit',e=>{if(e.target.id!=='evof')return;e.preventDefault();const pr=PRt();
 pr.evo.unshift({dt:hoje(),dente:$('#ev_d').value.trim(),proc:$('#ev_p').value.trim(),txt:$('#ev_t').value.trim()});evoPre='';log(pr,'Registrou evolução');toast('Evolução assinada e registrada');render()});

// ---------- render ----------
function render(){
 $('#nav').innerHTML=NAV.map(([k,n])=>`<button data-a="go" data-v="${k}" class="${k===view||(view==='pront'&&k==='pacientes')?'on':''}"><svg viewBox="0 0 24 24">${ic[k]}</svg>${n}${k==='conversas'&&unread()?`<i>${unread()}</i>`:''}</button>`).join('');
 $('#view').innerHTML=V[view]();
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 const sq=$('#sq');if(sq)sq.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
 const sf=$('#sf');if(sf)sf.onsubmit=e=>{e.preventDefault();const t=$('#mi').value.trim();if(!t)return;say(selC,'me',t);setTimeout(()=>{say(selC,'p',['Obrigada, Dra.! 😊','Combinado!','Perfeito, muito obrigado','Ok, aguardo então'][Math.random()*4|0])},1600)};
}
function ap(id){const a=A[id],p=P[a.p];
 dlg(`<h2>${p.n}</h2><p style="color:var(--mute)">${DAYS[a.d]}, ${fd(a.d)} · ${fh(a.h)} às ${fh(a.h+a.dur)}</p><p style="margin:12px 0"><b>${a.proc}</b> ${pill(a.st)}</p>${p.notes?`<p style="font-size:.85rem;background:var(--sand);padding:10px 12px;border-radius:12px">${p.notes}</p>`:''}
 <div class="acts"><button class="btn s" data-a="rem" data-i="${id}">Enviar lembrete</button><button class="btn s l" data-a="st" data-i="${id}" data-s="conf">Confirmar</button><button class="btn s l" data-a="st" data-i="${id}" data-s="done">Concluir</button><button class="btn s l" data-a="st" data-i="${id}" data-s="falt">Faltou</button><button class="btn s l" data-a="ficha" data-i="${p.id}">Prontuário</button><button class="btn s l" data-a="chat" data-i="${p.id}">Conversar</button><button class="btn s l" data-a="del" data-i="${id}">Cancelar</button></div>`)}
function ficha(id){pid=id;ptab='resumo';selT=null;omode='atual';tool='ver';dent=(AGES[id]??30)<12?'mista':'perm';$('#dlg').open&&$('#dlg').close();view='pront';log(PRt(),'Visualizou o prontuário');render();$('main').scrollTop=0}
function novo(pre,d,h){
 dlg(`<h2>Novo agendamento</h2><form id="nf"><label>Paciente</label><select id="np">${P.map(p=>`<option value="${p.id}" ${p.id===pre?'selected':''}>${p.n}</option>`).join('')}</select>
 <label>Procedimento</label><input id="nproc" value="Avaliação"><div style="display:flex;gap:10px"><div style="flex:1"><label>Dia</label><select id="nd">${DAYS.map((n,i)=>`<option value="${i}" ${i===(d??dow)?'selected':''}>${n} ${fd(i)}</option>`).join('')}</select></div><div style="flex:1"><label>Horário</label><select id="nh">${Array.from({length:20},(_,i)=>H0+i/2).map(x=>`<option value="${x}" ${x===(h??9)?'selected':''}>${fh(x)}</option>`).join('')}</select></div></div>
 <div class="acts"><button class="btn">Agendar</button><button type="button" class="btn l" onclick="$('#dlg').close()">Cancelar</button></div></form>`);
 $('#nf').onsubmit=e=>{e.preventDefault();const a={id:A.length?Math.max(...A.map(x=>x.id))+1:0,d:+$('#nd').value,h:+$('#nh').value,dur:1,p:+$('#np').value,proc:$('#nproc').value,st:'pend'};
  A.push(a);$('#dlg').close();toast('Agendado. Lembrete automático programado para 24h antes.');render()}}
const byId=id=>A.findIndex(a=>a.id===id);

// ---------- eventos ----------
document.addEventListener('click',e=>{
 const col=e.target.closest('.col');
 if(col&&!e.target.closest('.ap')){const r=col.getBoundingClientRect();return novo(undefined,+col.dataset.d,H0+Math.floor((e.clientY-r.top)/PX*2)/2)}
 const t=e.target.closest('[data-a]');if(!t||t.dataset.a==='sw'||t.dataset.a==='note')return;
 const a=t.dataset.a,i=+t.dataset.i,X=A.find(x=>x.id===i);
 if(a==='go'){view=t.dataset.v;$('#dlg').open&&$('#dlg').close();render()}
 else if(a==='ap')ap(i);
 else if(a==='ficha')ficha(i);
 else if(a==='novo')novo(isNaN(i)?undefined:i);
 else if(a==='chat'){selC=i;view='conversas';$('#dlg').open&&$('#dlg').close();render()}
 else if(a==='st'){X.st=t.dataset.s;$('#dlg').close();render();toast('Status atualizado')}
 else if(a==='del'){A=A.filter(x=>x.id!==i);$('#dlg').close();render();toast('Consulta cancelada')}
 else if(a==='rem'){const p=P[X.p];say(p.id,'bot',`Olá, ${p.n.split(' ')[0]}! Lembrete da sua consulta ${DAYS[X.d]} às ${fh(X.h)} com a Dra. Ana Beatriz. Responda 1 para confirmar ou 2 para remarcar.`);
  $('#dlg').close();toast('Lembrete enviado pelo WhatsApp');
  setTimeout(()=>{say(p.id,'p','1');X.st='conf';toast(`${p.n.split(' ')[0]} confirmou pelo WhatsApp ✔`);render()},2200)}
 else if(a==='tpl'){$('#mi').value=t.dataset.t;$('#mi').focus()}
 else if(a==='recall'){P.filter(p=>p.m>=6).forEach(p=>say(p.id,'bot',`Olá, ${p.n.split(' ')[0]}! Já faz ${p.m} meses da sua última limpeza. Vamos agendar seu retorno?`));toast('Recall enviado a '+P.filter(p=>p.m>=6).length+' pacientes')}
 else if(a==='mv'){const l=L[i];l.c+=+t.dataset.x;if(l.c===2&&!P.some(p=>p.n===l.n)){const id=P.length;P.push({id,n:l.n,tel:'(85) 9____-____',m:0,tags:['Veio de '+l.s],notes:l.m,lgpd:new Date().toLocaleDateString('pt-BR')});C[id]=[];toast('Lead virou paciente')}render()}
 else if(a==='newp'){dlg(`<h2>Novo paciente</h2><form id="pf"><label>Nome</label><input id="pn" required><label>WhatsApp</label><input id="pt" placeholder="(85) 9…"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" required style="width:auto"> Paciente autorizou o tratamento dos dados (LGPD)</label><div class="acts"><button class="btn">Salvar</button></div></form>`);
  $('#pf').onsubmit=ev=>{ev.preventDefault();const id=P.length;P.push({id,n:$('#pn').value,tel:$('#pt').value,m:0,tags:[],notes:'',lgpd:new Date().toLocaleDateString('pt-BR')});C[id]=[];$('#dlg').close();render();toast('Paciente cadastrado')}}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.a==='sw'){AU[t.dataset.i].on=t.checked?1:0;render()}
 if(t.dataset.a==='note')P[t.dataset.i].notes=t.value});
addEventListener('hashchange',()=>{view=location.hash.slice(1)||'hoje';render()});
view=location.hash.slice(1)||'hoje';if(view==='pront')log(PRt(),'Visualizou o prontuário');render();
</script>
