<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposta AURA · Dra. Ana Beatriz Bomfim</title>
<style>
body{margin:0;background:#1d1510;color:#f6eee3;font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;min-height:100vh;box-sizing:border-box}
h1{font:600 22px Georgia,serif;margin:0;color:#e9d8a6}
canvas{width:min(100%,1280px);aspect-ratio:16/9;border-radius:12px;box-shadow:0 30px 80px #000a;background:#000}
input[type=range]{width:min(100%,1280px);accent-color:#b98b4e}
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:700 16px system-ui,sans-serif;border:0;border-radius:99px;padding:14px 26px;cursor:pointer;background:#e9d8a6;color:#3b2a20}
button.s{background:transparent;color:#e9d8a6;border:1.5px solid #e9d8a655}
button:disabled{opacity:.5;cursor:wait}
#st{opacity:.85;min-height:20px;text-align:center;max-width:720px}
</style>
</head>
<body>
<h1>Proposta AURA Digital Studio · Dra. Ana Beatriz Bomfim</h1>
<canvas id="c" width="1920" height="1080"></canvas>
<input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Linha do tempo">
<div class="bar"><button id="play" class="s" disabled>▶ Assistir com som</button><button id="rec" disabled>⬇ Baixar MP4</button></div>
<div id="st">Carregando…</div>
<script>
// ================= DADOS EMBUTIDOS =================
const FONTS={corm:'data:font/woff2;base64,{{F_CORM}}',cormi:'data:font/woff2;base64,{{F_CORMI}}',man:'data:font/woff2;base64,{{F_MAN}}',cav:'data:font/woff2;base64,{{F_CAV}}'};
const PH={sobre:'{{I_SOBRE}}',cirurgia:'{{I_CIRURGIA}}',consultorio:'{{I_CONSULTORIO}}',hero:'{{I_HERO}}',clareamento:'{{I_CLAREAMENTO}}',radiografia:'{{I_RADIOGRAFIA}}',prevencao:'{{I_PREVENCAO}}',aura:'{{I_AURA}}'};

// ================= BASE =================
const W=1920,H=1080,DUR=60,FPS=30,BEAT=.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={cream:'#f6eee3',sand:'#ecdcc4',mustard:'#e9d8a6',gold:'#b98b4e',choc:'#3b2a20',wood:'#8a5a34',blush:'#e9c9bd',ink:'#2a1e17',paper:'#fffaf3',red:'#b5473f',blue:'#2f5d8a',ok:'#3f8a5f',warn:'#c48a2c',mute:'#8a7f76',wa:'#25d366'};
const IMG={};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const bell=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const rgba=(h,a)=>`rgba(${hex(h)},${a})`;
const mix=(a,b,t)=>`rgb(${hex(a).map((v,i)=>Math.round(lerp(v,hex(b)[i],t)))})`;
const vis=(t,a,b,fi=.5,fo=.5)=>Math.min(eOut(P(t,a,a+fi)),1-eIO(P(t,b-fo,b)));
const beatP=t=>Math.exp(-((t/BEAT)%1)*6);
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const norm=s=>s.toLowerCase().replace(/[^\p{L}\d]/gu,'');

// logo original (mesmo SVG do site), com as fontes embutidas
const logoSVG=col=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="1040" height="800" style="color:${col}"><style>@font-face{font-family:'Cormorant Garamond';font-weight:300 700;src:url(${FONTS.corm})}@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:300 700;src:url(${FONTS.cormi})}@font-face{font-family:Manrope;font-weight:200 800;src:url(${FONTS.man})}</style>
<path d="M130 8l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="currentColor"/>
<path d="M76 138V92a54 54 0 0 1 108 0v46z" fill="none" stroke="currentColor" stroke-width="1.6"/>
<path d="M87 138V94a43 43 0 0 1 86 0v44" fill="none" stroke="currentColor" stroke-width=".7" opacity=".6"/>
<text x="130" y="128" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="74" font-weight="600" letter-spacing="-10" fill="currentColor">A<tspan font-style="italic" font-weight="400" dx="-4">B</tspan></text>
<text x="130" y="163" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" font-weight="500" letter-spacing="2.6" fill="currentColor">DRA. ANA BEATRIZ BOMFIM</text>
<text x="130" y="181" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" letter-spacing="4" fill="currentColor" opacity=".8">CIRURGIÃ-DENTISTA</text></svg>`;

let GRAIN=[],LIGHTS=[],DUST=[];
const ready=(async()=>{
 for(const [f,u,d] of [['Cormorant Garamond',FONTS.corm,{weight:'300 700'}],['Cormorant Garamond',FONTS.cormi,{weight:'300 700',style:'italic'}],['Manrope',FONTS.man,{weight:'200 800'}],['Caveat',FONTS.cav,{weight:'400 700'}]]){const ff=new FontFace(f,`url(${u})`,d);await ff.load();document.fonts.add(ff)}
 const ld=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
 for(const k in PH)IMG[k]=await ld(PH[k]);
 // a logo vira imagem; espera as fontes internas do SVG e rasteriza num canvas
 for(const [k,col] of [['logoGold',C.gold],['logoMus',C.mustard],['logoWhite','#ffffff']]){
  const im=await ld('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(logoSVG(col)));await new Promise(r=>setTimeout(r,250));
  const c=document.createElement('canvas');c.width=1040;c.height=800;c.getContext('2d').drawImage(im,0,0);IMG[k]=c}
 const R=rng(42);
 for(let n=0;n<3;n++){const c=document.createElement('canvas');c.width=c.height=400;const g=c.getContext('2d'),d=g.createImageData(400,400);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);GRAIN.push(ctx.createPattern(c,'repeat'))}
 const cols=[C.gold,C.mustard,C.blush,'#ffffff',C.gold];
 for(let i=0;i<14;i++)LIGHTS.push({x:R()*W,y:R()*H,r:160+R()*300,c:cols[i%5],a:.10+R()*.16,sp:.12+R()*.25,ph:R()*6});
 for(let i=0;i<55;i++)DUST.push({x:R()*W,y:R()*H,s:1.2+R()*2.6,v:8+R()*26,ph:R()*6});
})();

// ================= FORMAS DA LINHA DOURADA =================
const N=260;
function resample(pts,closed){const Q=closed?[...pts,pts[0]]:pts,d=[0];for(let i=1;i<Q.length;i++)d.push(d[i-1]+Math.hypot(Q[i][0]-Q[i-1][0],Q[i][1]-Q[i-1][1]));const L=d.at(-1),o=[];let j=0;for(let k=0;k<N;k++){const s=L*k/(N-1);while(j<d.length-2&&d[j+1]<s)j++;const u=(s-d[j])/((d[j+1]-d[j])||1);o.push([lerp(Q[j][0],Q[j+1][0],u),lerp(Q[j][1],Q[j+1][1],u)])}return o}
function archPts(x,y,w,h){const r=w/2,p=[[x,y+h]];for(let i=0;i<=48;i++){const a=Math.PI+Math.PI*i/48;p.push([x+r+r*Math.cos(a),y+r+r*Math.sin(a)])}p.push([x+w,y+h]);return p}
function rrPts(x,y,w,h,r){const p=[],q=(cx,cy,a0)=>{for(let i=0;i<=10;i++){const a=a0+Math.PI/2*i/10;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}};p.push([x,y+h-r]);q(x+r,y+r,Math.PI);q(x+w-r,y+r,-Math.PI/2);q(x+w-r,y+h-r,0);q(x+r,y+h-r,Math.PI/2);return p}
const PX=1100,PY=150,PW=520,PHh=780;               // foto em arco (cena 2)
const BX=700,BY=150,BW=1060,BH=780,TB=56;           // janela do navegador (cenas 4 e 5)
const LW=440,LS=LW/260,LX=(W-LW)/2,LY=100;          // logo final
const SH={
 line:resample(Array.from({length:80},(_,i)=>[260+i*1400/79,800+Math.sin(i*.3)*7]),false),
 arch:resample(archPts(PX-26,PY-26,PW+52,PHh+52),true),
 under:resample(Array.from({length:40},(_,i)=>[640+i*640/39,690+Math.sin(i*.4)*4]),false),
 brw:resample(rrPts(BX,BY,BW,BH,28),true),
 logo:resample(archPts(LX+76*LS,LY+38*LS,108*LS,100*LS),true)};

// ================= AJUDANTES DE DESENHO =================
function cover(img,x,y,w,h,fx=.5,fy=.5,z=1){const iw=img.width,ih=img.height,s=Math.max(w/iw,h/ih)*z,sw=w/s,sh=h/s;ctx.drawImage(img,clamp(fx*iw-sw/2,0,iw-sw),clamp(fy*ih-sh/2,0,ih-sh),sw,sh,x,y,w,h)}
function archPath(x,y,w,h){ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y+w/2);ctx.arc(x+w/2,y+w/2,w/2,Math.PI,0);ctx.lineTo(x+w,y+h);ctx.closePath()}
function txt(s,x,y,font,col,align='left',a=1,ls='0px'){ctx.save();ctx.globalAlpha*=a;ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.letterSpacing=ls;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.restore()}
function wrap(s,font,maxW){ctx.font=font;const out=[];let cur='';s.split(' ').forEach(w=>{const n=cur?cur+' '+w:w;if(ctx.measureText(n).width>maxW&&cur){out.push(cur);cur=w}else cur=n});out.push(cur);return out}

// texto palavra por palavra, com máscara, e palavra principal em destaque
const LC=new Map();
function layout(text,font,hiFont,size,maxW,hi){const k=[text,font,size,maxW].join('|');if(LC.has(k))return LC.get(k);const lines=[];let cur=[],w=0;const sp=size*.27;
 text.split(' ').forEach(word=>{const isHi=hi.some(h=>norm(h)===norm(word));ctx.font=(isHi?hiFont:font).replace('{s}',size);const ww=ctx.measureText(word).width;if(cur.length&&w+sp+ww>maxW){lines.push({ws:cur,w});cur=[];w=0}w+=(cur.length?sp:0)+ww;cur.push({word,ww,isHi})});lines.push({ws:cur,w});LC.set(k,lines);return lines}
function words(t,o){const {text,x,y,t0,t1=999,size=64,font='600 {s}px "Cormorant Garamond"',hiFont='italic 600 {s}px "Cormorant Garamond"',color=C.ink,hi=[],align='left',maxW=1600,lh=1.12,st=.085,dur=.75,under=true}=o;
 const lines=layout(text,font,hiFont,size,maxW,hi);if(t<t0||t>t1+1.4)return lines.length;let idx=0;const sp=size*.27;
 lines.forEach((ln,li)=>{const ly=y+li*size*lh;let lx=align==='center'?x-ln.w/2:x;
  ln.ws.forEach(wd=>{const i=idx++,a0=t0+i*st,p=eOut(P(t,a0,a0+dur)),q=eIO(P(t,t1+i*.02,t1+i*.02+.55));
   if(p>0&&q<1){ctx.save();ctx.beginPath();ctx.rect(lx-size*.25,ly-size*1.02,wd.ww+size*.5,size*1.34);ctx.clip();
    ctx.globalAlpha*=Math.min(1,p*1.5)*(1-q);ctx.font=(wd.isHi?hiFont:font).replace('{s}',size);ctx.textBaseline='alphabetic';
    const dy=(1-p)*size*1.05-q*size*1.05;
    if(wd.isHi){const off=(t*260)%(wd.ww*3)-wd.ww,g=ctx.createLinearGradient(lx+off-wd.ww,0,lx+off+wd.ww,0);g.addColorStop(0,C.gold);g.addColorStop(.5,'#f0d596');g.addColorStop(1,C.gold);ctx.fillStyle=g;ctx.shadowColor=rgba(C.gold,.5);ctx.shadowBlur=26*p}else ctx.fillStyle=color;
    ctx.fillText(wd.word,lx,ly+dy);ctx.restore();
    if(wd.isHi&&under){const u=eOut(P(t,a0+.35,a0+1));ctx.save();ctx.globalAlpha*=1-q;ctx.strokeStyle=C.gold;ctx.lineWidth=Math.max(2,size*.035);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lx,ly+size*.17);ctx.lineTo(lx+wd.ww*u,ly+size*.17);ctx.stroke();ctx.restore()}}
   lx+=wd.ww+sp})});return lines.length}
function chips(t,list,x,y,t1){let cx=x;ctx.font='600 30px Manrope';list.forEach(([label,t0])=>{const w=ctx.measureText(label).width+60,p=P(t,t0,t0+.5),q=eIO(P(t,t1,t1+.4));if(p>0&&q<1){const s=eBack(p);ctx.save();ctx.translate(cx+w/2,y);ctx.scale(s,s);ctx.globalAlpha*=Math.min(1,p*2)*(1-q);ctx.fillStyle='rgba(255,255,255,.6)';ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-w/2,-32,w,64,32);ctx.fill();ctx.stroke();txt(label,0,11,'600 30px Manrope',C.ink,'center');ctx.restore()}cx+=w+16})}
function spark(x,y,r,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,250,235,${a})`);g.addColorStop(.25,`rgba(240,213,150,${a*.6})`);g.addColorStop(1,'rgba(185,139,78,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function star(x,y,r,a){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=C.gold;ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.28:r,an=i*Math.PI/4-Math.PI/2;ctx.lineTo(x+rr*Math.cos(an),y+rr*Math.sin(an))}ctx.fill();ctx.restore()}
function sparkles(t,x,y,t0,n=5,sp=90){for(let i=0;i<n;i++){const a=t0+i*.12,p=P(t,a,a+.8);if(p>0&&p<1){const an=i*2.4,d=sp*(.4+.6*eOut(p));star(x+Math.cos(an)*d,y+Math.sin(an)*d*.6,18*(1-p)+4,Math.sin(p*Math.PI))}}}
function toast(t,msg,x,y,t0,t1,col=C.ok){const p=eOut(P(t,t0,t0+.4)),q=eIO(P(t,t1,t1+.35));if(p<=0||q>=1)return;ctx.save();ctx.globalAlpha*=p*(1-q);ctx.font='700 17px Manrope';const w=ctx.measureText(msg).width+48;ctx.translate(x,y+(1-p)*30);ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=24;ctx.fillStyle=C.choc;ctx.beginPath();ctx.roundRect(-w/2,-24,w,48,24);ctx.fill();ctx.shadowBlur=0;txt(msg,0,6,'700 17px Manrope',C.cream,'center');ctx.restore()}

// ================= FUNDO =================
function bg(t){const dk=eIO(P(t,54.8,56));
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,mix(C.cream,'#2c1f17',dk));g.addColorStop(1,mix(C.sand,'#3b2a20',dk));ctx.fillStyle=g;ctx.fillRect(-60,-60,W+120,H+120);
 ctx.fillStyle=rgba(C.wood,.045*(1-dk));for(let x=-((t*8)%64);x<W;x+=64)ctx.fillRect(x,-60,3,H+120);
 const bp=beatP(t);
 LIGHTS.forEach(L=>{const x=L.x+Math.sin(t*L.sp+L.ph)*90,y=L.y+Math.cos(t*L.sp*.8+L.ph)*70,r=L.r*(1+.05*bp),col=dk>.5?C.gold:L.c,a=L.a*(1+.35*bp)*(dk>.5?.7:1),gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2)});
 DUST.forEach(d=>{const y=((d.y-t*d.v)%(H+40)+H+40)%(H+40)-20,x=d.x+Math.sin(t*.7+d.ph)*20,a=(.22+.3*Math.sin(t*2.2+d.ph)+.3*bp)*(dk>.5?1.3:.8);ctx.fillStyle=rgba(dk>.5?C.mustard:C.gold,clamp(a));ctx.beginPath();ctx.arc(x,y,d.s,0,7);ctx.fill()})}

// ================= LINHA DOURADA (acompanha o vídeo todo) =================
const KEYS=[[0,'line'],[3.7,'line'],[4.6,'arch'],[13.8,'arch'],[14.7,'under'],[17.6,'under'],[18.5,'brw'],[54.5,'brw'],[55.8,'logo'],[60,'logo']];
function linePts(t){for(let i=0;i<KEYS.length-1;i++){const [a,A]=KEYS[i],[b,B]=KEYS[i+1];if(t<=b){if(A===B)return SH[A];const e=eIO(P(t,a,b));return SH[A].map((p,k)=>[lerp(p[0],SH[B][k][0],e),lerp(p[1],SH[B][k][1],e)])}}return SH.logo}
function goldLine(t){const pts=linePts(t),frac=eOut(P(t,.15,1.4)),a=1-eIO(P(t,55.9,56.8))*.85,n=Math.max(2,Math.floor(frac*N));
 ctx.save();ctx.globalAlpha*=a;ctx.lineCap=ctx.lineJoin='round';
 [[10,.12],[3,1]].forEach(([lw,al])=>{ctx.strokeStyle=rgba(C.gold,al);ctx.lineWidth=lw;ctx.shadowColor=rgba(C.gold,.6);ctx.shadowBlur=lw>5?0:14;ctx.beginPath();for(let i=0;i<n;i++)ctx[i?'lineTo':'moveTo'](...pts[i]);ctx.stroke()});
 ctx.restore();
 // faíscas que percorrem a linha
 const bp=beatP(t);[0,.5].forEach(o=>{const k=Math.floor((((t*.18+o)%1)*frac)*(N-1));const [x,y]=pts[k];spark(x,y,26+10*bp,.95)});
 if(frac<1){const [x,y]=pts[n-1];spark(x,y,46,1)}}

// ================= TRANSIÇÕES =================
function sweep(t,a,d){const p=P(t,a,a+d);if(p<=0||p>=1)return;const x=lerp(-700,W+700,eIO(p));ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(x-420,0,x+420,0);g.addColorStop(0,'rgba(255,240,210,0)');g.addColorStop(.5,'rgba(255,240,210,.55)');g.addColorStop(1,'rgba(255,240,210,0)');ctx.translate(x,H/2);ctx.rotate(-.25);ctx.translate(-x,-H/2);ctx.fillStyle=g;ctx.fillRect(x-420,-400,840,H+800);ctx.restore();
 ctx.fillStyle=`rgba(255,250,238,${Math.sin(p*Math.PI)*.35})`;ctx.fillRect(-60,-60,W+120,H+120)}
function liquid(t){const p=P(t,15.95,17.15);if(p<=0||p>=1)return;
 const lead=lerp(H+140,-300,eIO(clamp(p*1.35))),trail=lerp(H+140,-300,eIO(clamp((p-.34)*1.35))),wv=(x,ph)=>Math.sin(x*.006+t*4+ph)*40+Math.sin(x*.017-t*3+ph)*16;
 ctx.save();ctx.beginPath();for(let x=-40;x<=W+40;x+=24)ctx.lineTo(x,trail+wv(x,2));for(let x=W+40;x>=-40;x-=24)ctx.lineTo(x,lead+wv(x,0));ctx.closePath();
 const g=ctx.createLinearGradient(0,lead-60,0,trail+60);g.addColorStop(0,'#f0d596');g.addColorStop(.45,C.gold);g.addColorStop(1,C.wood);ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='rgba(255,248,230,.7)';ctx.lineWidth=5;ctx.beginPath();for(let x=-40;x<=W+40;x+=24)ctx.lineTo(x,lead+wv(x,0)+6);ctx.stroke();
 for(let i=0;i<14;i++){const bx=(i*151+t*60)%W,by=lerp(lead,trail,(i*.37)%1)+Math.sin(t*3+i)*20;ctx.fillStyle='rgba(255,248,230,.35)';ctx.beginPath();ctx.arc(bx,by,6+(i%4)*5,0,7);ctx.fill()}ctx.restore()}
function camera(t){return 1+.012*Math.sin(t*.45)+.05*bell(t,4.15,.35)+.04*bell(t,14.2,.35)+.05*bell(t,16.6,.4)+.05*bell(t,18.1,.4)+.06*bell(t,31.9,.35)+.05*bell(t,55,.45)}

// ================= CENA 1 · GANCHO =================
function scene1(t){if(t>4.7)return;
 words(t,{text:'Ana Beatriz,',x:W/2,y:430,t0:.25,t1:3.7,font:'italic 500 {s}px "Cormorant Garamond"',size:80,color:C.gold,align:'center'});
 words(t,{text:'a sua história merece ser vista.',x:W/2,y:580,t0:.55,t1:3.75,size:112,align:'center',maxW:1250,hi:['vista.']});
 sparkles(t,1150,660,1.55,6,110)}

// ================= CENA 2 · TRAJETÓRIA =================
const SHOTS=[['sobre',3.9,7.4,.6,.3],['cirurgia',7.4,10.8,.5,.3],['consultorio',10.8,14.6,.55,.28]];
function scene2(t){if(t<3.8||t>14.9)return;
 const rev=eOut(P(t,4.0,5.0)),ex=eIO(P(t,13.9,14.7));
 ctx.save();ctx.globalAlpha*=rev*(1-ex);ctx.shadowColor='rgba(59,42,32,.35)';ctx.shadowBlur=70;ctx.shadowOffsetY=30;ctx.fillStyle=C.sand;archPath(PX,PY,PW,PHh);ctx.fill();ctx.restore();

 function whoosh(t,d,v=.45,f0=300,f1=4200){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),p=ac.createStereoPanner();s.buffer=nb;s.loop=true;fl.type='bandpass';fl.Q.value=1.3;fl.frequency.setValueAtTime(f0,T(t));fl.frequency.exponentialRampToValueAtTime(f1,T(t+d*.7));fl.frequency.exponentialRampToValueAtTime(f0*1.6,T(t+d));g.gain.setValueAtTime(.0001,T(t));g.gain.exponentialRampToValueAtTime(v,T(t+d*.6));g.gain.exponentialRampToValueAtTime(.0001,T(t+d));p.pan.setValueAtTime(-.6,T(t));p.pan.linearRampToValueAtTime(.6,T(t+d));s.connect(fl);fl.connect(g);g.connect(p);p.connect(master);send(g,.4);s.start(T(t));s.stop(T(t+d)+.1)}
 function riser(a,b){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;s.loop=true;fl.type='highpass';fl.frequency.setValueAtTime(400,T(a));fl.frequency.exponentialRampToValueAtTime(6000,T(b));g.gain.setValueAtTime(.0001,T(a));g.gain.exponentialRampToValueAtTime(.22,T(b));g.gain.linearRampToValueAtTime(.0001,T(b)+.05);s.connect(fl);fl.connect(g);g.connect(master);send(g,.3);s.start(T(a));s.stop(T(b)+.1);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(180,T(a));o.frequency.exponentialRampToValueAtTime(720,T(b));og.gain.setValueAtTime(.0001,T(a));og.gain.exponentialRampToValueAtTime(.08,T(b));og.gain.linearRampToValueAtTime(.0001,T(b)+.05);o.connect(og);og.connect(master);o.start(T(a));o.stop(T(b)+.1)}
 function impact(t,v=1){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(90,T(t));o.frequency.exponentialRampToValueAtTime(38,T(t)+.5);g.gain.setValueAtTime(v*.9,T(t));g.gain.exponentialRampToValueAtTime(.001,T(t)+1.1);o.connect(g);g.connect(master);send(g,.3);o.start(T(t));o.stop(T(t)+1.2);noise(t,.7,.3*v,'lowpass',500,.7,master,.5)}
 const sparkle=t=>[2093,2637,3136,4186].forEach((f,i)=>tone(t+i*.05,f,.55,.05,'sine',master,.9));
 const tick=(t,v=1)=>{tone(t,1700,.05,.07*v,'triangle',master,.1);noise(t,.02,.05*v,'highpass',5000)};
 const click=t=>{noise(t,.03,.25,'highpass',3000);tone(t,900,.05,.15,'sine',master,0)};
 const ding=t=>{tone(t,1318.5,.6,.11,'sine',master,.5);tone(t+.09,1760,.7,.11,'sine',master,.5)};
 const chime=t=>[1046.5,1318.5,1568].forEach((f,i)=>tone(t+i*.08,f,.8,.08,'sine',master,.6));
 function bloop(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(900,T(t));o.frequency.exponentialRampToValueAtTime(160,T(t)+.35);g.gain.setValueAtTime(.25,T(t));g.gain.exponentialRampToValueAtTime(.001,T(t)+.4);o.connect(g);g.connect(master);send(g,.5);o.start(T(t));o.stop(T(t)+.45)}
 // ---- música: lo-fi a 120 BPM (uma batida a cada meio segundo) ----
 const PROG=[[53,57,60,64,41],[52,55,59,62,40],[50,53,57,60,38],[48,52,55,59,36]];
 const drums=t=>(t>=4&&t<14)||(t>=18&&t<54.4),penta=[72,74,76,79,81,84];
 for(let bar=0;bar<28;bar++){const t0=bar*2,ch=PROG[bar%4];
  ch.slice(0,4).forEach(m=>{ep(t0,m,1.75,.13,pad);if(!(t0>=14&&t0<18))ep(t0+1.25,m,.6,.07,pad)});
  if(drums(t0)){tone(t0,mtof(ch[4]),.9,.28,'sine',master,0,.01);tone(t0+1,mtof(ch[4]),.45,.2,'sine',master,0,.01);tone(t0+1.5,mtof(ch[4]+12),.3,.14,'triangle',master,0,.01)}
  for(let s=0;s<8;s++){const t=t0+s*.25+(s%2?.035:0);
   if(drums(t)){if(s===0||s===5||(s===3&&bar%2))kick(t,s===0?1:.75);if(s===2||s===6)snare(t);hat(t,s%2?.6:1)}
   else if(t>=2&&t<55.2)hat(t,t>=14&&t<18?.45:.7);
   if(t>=18&&t<54&&(s===1||s===3||s===4||s===6)&&R()<.5)tone(t,mtof(penta[Math.floor(R()*penta.length)]),.35,.07,'triangle',master,.5)}}
 for(let t=17.25;t<18;t+=.125)snare(t,.25+(t-17.25));
 // final: acorde aberto e brilho
 [41,53,57,60,64,67,69].forEach(m=>ep(55.8,m,3.6,.12,master));[84,88,91,96].forEach((m,i)=>tone(56.3+i*.12,mtof(m),1.4,.05,'sine',master,.9));
 // ---- efeitos no ritmo da imagem ----
 whoosh(.1,1.3,.35,200,3000);[[3.7,.9],[13.8,.9],[17.6,1],[31.3,1],[54.3,1.3]].forEach(([t,d])=>whoosh(t,d));whoosh(16,1.1,.5,150,2000);bloop(16.05);
 [[4.1,1],[18.2,1],[32.2,.55],[55.8,1.1]].forEach(([t,v])=>impact(t,v));riser(16.4,18.15);riser(53.9,55.75);
 [1.6,5.3,12.4,17.3,36.4,46.2,56.4].forEach(sparkle);
 [7.9,8.3,8.7,9.1,25.9,26.4,26.9].forEach(t=>tick(t));for(let t=11;t<12.35;t+=.12)tick(t,.5);
 for(let t=18.5;t<19.5;t+=.07)noise(t,.025,.05,'bandpass',3500,1.5);for(let t=32.2;t<33;t+=.07)noise(t,.025,.05,'bandpass',3500,1.5);
 for(let i=0;i<12;i++)tick(33+i*.25,.6);click(30.45);ding(39.1);ding(40.8);chime(41.35);tick(41.6);chime(36.7);chime(46.6);
 whoosh(49.5,.7,.35,200,1500);for(let t=51.6;t<52.6;t+=.03)noise(t,.04,.04+R()*.06,'bandpass',2500+R()*1500,2);impact(52.9,.35);
 for(let i=0;i<260;i++)noise(R()*59.5,.008,.012+R()*.03,'highpass',2000)}

// ================= REPRODUÇÃO, GRAVAÇÃO E EXPORTAÇÃO =================
const $=id=>document.getElementById(id),st=m=>$('st').textContent=m;
let running=false;
function play(record){return new Promise(async res=>{running=true;const ac=new AudioContext({sampleRate:48000}),out=ac.createGain();out.connect(ac.destination);
 let rec,chunks=[],mime='';
 if(record){const md=ac.createMediaStreamDestination();out.connect(md);const stream=new MediaStream([...cv.captureStream(FPS).getVideoTracks(),...md.stream.getAudioTracks()]);
  mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6,audioBitsPerSecond:256e3});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start(500)}
 const T0=ac.currentTime+.25;buildAudio(ac,out,T0);
 (function loop(){const t=ac.currentTime-T0;render(Math.max(0,t));$('seek').value=t;if(record)st(`Gravando… ${Math.max(0,Math.floor(t))}s de 60s. Não troque de aba.`);
  if(t<DUR+.2)requestAnimationFrame(loop);else{running=false;if(!rec){ac.close();st('Fim. Use o botão "Baixar MP4" para salvar o vídeo.');return res()}
   rec.onstop=()=>{const b=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Proposta-AURA-Dra-Ana-Beatriz.'+(mime.includes('mp4')?'mp4':'webm');a.click();ac.close();st(mime.includes('mp4')?'Pronto! O MP4 foi baixado.':'Pronto! Este Chrome não grava MP4, então o vídeo saiu em WebM.');res()};rec.stop()}})()})}
ready.then(()=>{render(0);st('Pronto. Clique em "Baixar MP4" e espere 60 segundos, sem trocar de aba.');$('play').disabled=$('rec').disabled=false});
$('seek').oninput=e=>{if(!running)render(+e.target.value)};
$('play').onclick=async()=>{if(running)return;$('play').disabled=$('rec').disabled=true;st('Tocando…');await play(false);$('play').disabled=$('rec').disabled=false};
$('rec').onclick=async()=>{if(running)return;$('play').disabled=$('rec').disabled=true;await play(true);$('play').disabled=$('rec').disabled=false};
// usado pelo exportador automático (quadro a quadro)
window.__ready=ready;window.__frame=i=>{render(i/FPS);return cv.toDataURL('image/jpeg',.95)};
window.__wav=async()=>{const oc=new OfflineAudioContext(2,48000*DUR,48000);buildAudio(oc,oc.destination,0);const b=await oc.startRendering(),n=b.length,dv=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');dv.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,48000,true);dv.setUint32(28,192000,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*4,true);
 const L=b.getChannelData(0),Rr=b.getChannelData(1);for(let i=0;i<n;i++){dv.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,clamp(Rr[i],-1,1)*32767,true)}
 const u=new Uint8Array(dv.buffer);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
</script>
